<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>حديدي — متابعة التمرين</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Rubik:wght@500;600;700&display=swap');
  :root{
    --bg:#0a0e14;--panel:#0f1620;--panel-2:#0c121b;--line:#1c2836;--line-soft:#161f2b;
    --ink:#e8eff6;--ink-dim:#8496a9;--ink-faint:#57687a;
    --amber:#f5a524;--amber-deep:#b9760a;--green:#2fbf71;--green-dim:#186b40;--red:#e0533d;--blue:#3d9be0;--radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Cairo',system-ui,sans-serif;
    background:radial-gradient(1000px 500px at 50% -10%,#131e2b 0%,transparent 55%),var(--bg);
    color:var(--ink);min-height:100vh;padding:0 0 132px;-webkit-font-smoothing:antialiased;}
  .num{font-family:'Rubik',sans-serif;font-variant-numeric:tabular-nums;}

  header{position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,rgba(10,14,20,.97),rgba(10,14,20,.82));
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);padding:12px 16px 11px;}
  .top{display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:9px;}
  .brand-mark{width:30px;height:30px;border-radius:8px;flex:0 0 auto;
    background:linear-gradient(145deg,var(--amber),var(--amber-deep));display:grid;place-items:center;}
  .brand-mark svg{width:17px;height:17px;}
  .brand h1{font-size:17px;font-weight:800;margin:0;letter-spacing:-.2px;}
  .brand .sub{font-size:10.5px;color:var(--ink-faint);font-weight:600;margin-top:1px;}
  .tools{display:flex;gap:7px;}
  .icon-btn{width:36px;height:36px;border-radius:10px;background:var(--panel);
    border:1px solid var(--line);display:grid;place-items:center;cursor:pointer;color:var(--ink-dim);}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn:active{transform:scale(.94);}

  .days{display:flex;gap:7px;margin-top:12px;}
  .day-tab{flex:1;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);
    border-radius:11px;padding:9px 4px;font-family:'Cairo';font-weight:700;font-size:13.5px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;transition:.16s;}
  .day-tab .en{font-size:9px;font-weight:600;color:var(--ink-faint);font-family:'Rubik';letter-spacing:.6px;}
  .day-tab.active{background:linear-gradient(160deg,#182534,#131c28);border-color:var(--amber);color:var(--ink);}
  .day-tab.active .en{color:var(--amber);}

  .wrap{max-width:620px;margin:0 auto;padding:16px 12px 0;}

  .statbar{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;
    background:linear-gradient(135deg,#111e2c,#0d1620);border:1px solid var(--line);
    border-radius:var(--radius);padding:11px 8px;margin-bottom:15px;}
  .sc{text-align:center;padding:0 4px;}
  .sc .l{font-size:10px;color:var(--ink-faint);font-weight:600;margin-bottom:3px;}
  .sc .v{font-size:15px;font-weight:800;}
  .sc .v.num{font-size:16px;}
  .sc .v .u{font-size:10px;color:var(--ink-faint);font-weight:600;}
  .sc.timer .v{color:var(--amber);}
  .divv{width:1px;height:26px;background:var(--line);}

  .grp{font-size:11px;font-weight:700;color:var(--ink-faint);margin:16px 4px 8px;
    display:flex;align-items:center;gap:8px;}
  .grp::after{content:'';flex:1;height:1px;background:var(--line-soft);}

  .ex{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;}
  .ex-head{display:flex;align-items:center;gap:11px;padding:12px 13px;cursor:pointer;user-select:none;}
  .ex-idx{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:var(--panel-2);
    border:1px solid var(--line);display:grid;place-items:center;font-family:'Rubik';font-weight:700;font-size:13px;color:var(--amber);}
  .ex.done .ex-idx{background:var(--green-dim);border-color:var(--green);color:#eafff3;}
  .ex-mid{flex:1;min-width:0;}
  .ex-mid .ar{font-size:14px;font-weight:700;line-height:1.3;}
  .ex-mid .en{font-size:10.5px;color:var(--ink-faint);font-family:'Rubik';font-weight:500;margin-top:1px;}
  .ex-mid .lastline{font-size:10.5px;font-weight:700;margin-top:4px;color:var(--blue);font-family:'Cairo';}
  .ex-mid .lastline .num{font-family:'Rubik';}
  .ex-mid .lastline.none{color:var(--ink-faint);font-weight:600;}
  .ex-tags{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .badge{font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:20px;white-space:nowrap;}
  .badge.reps{background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line-soft);font-family:'Rubik';}
  .badge.warn{background:rgba(224,83,61,.15);color:var(--red);border:1px solid rgba(224,83,61,.3);}
  .badge.opt{background:rgba(61,155,224,.14);color:var(--blue);border:1px solid rgba(61,155,224,.3);}
  .chev{color:var(--ink-faint);transition:.25s;flex:0 0 auto;width:16px;height:16px;}
  .ex.open .chev{transform:rotate(180deg);}

  .sets{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .ex.open .sets{max-height:820px;}
  .sets-in{padding:0 13px 13px;}

  .set-row{display:grid;grid-template-columns:28px 1fr 1fr 38px;gap:8px;align-items:center;padding:5px 0;}
  .set-row.hd span{font-size:10px;color:var(--ink-faint);font-weight:700;text-align:center;}
  .set-no{text-align:center;font-family:'Rubik';font-weight:700;font-size:12px;color:var(--ink-dim);}
  .fld{position:relative;}
  .fld input{width:100%;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:'Rubik';font-weight:700;font-size:16px;text-align:center;padding:10px 3px;
    outline:none;transition:.15s;-moz-appearance:textfield;}
  .fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .fld input:focus{border-color:var(--amber);background:#0e151f;}
  .fld input::placeholder{color:var(--ink-faint);font-weight:500;}
  .chk{width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel-2);
    display:grid;place-items:center;cursor:pointer;transition:.15s;margin:0 auto;}
  .chk svg{width:15px;height:15px;opacity:.22;}
  .chk.on{background:var(--green-dim);border-color:var(--green);}
  .chk.on svg{opacity:1;}

  .row-tools{display:flex;gap:7px;margin-top:7px;}
  .mini{flex:1;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);
    border-radius:9px;padding:8px;font-family:'Cairo';font-weight:700;font-size:11.5px;cursor:pointer;}
  .mini.rest{color:var(--amber);border-color:rgba(245,165,36,.25);}
  .mini.rm{color:var(--red);}
  .mini:active{transform:scale(.97);}

  .note{font-size:11px;color:var(--ink-faint);line-height:1.6;padding:8px 10px;margin-top:8px;
    background:var(--panel-2);border-radius:9px;border-right:2px solid var(--amber-deep);}
  .note b{color:var(--amber);font-weight:700;}

  .bottombar{position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:linear-gradient(180deg,rgba(10,14,20,.55),rgba(10,14,20,.98));
    backdrop-filter:blur(12px);border-top:1px solid var(--line-soft);
    padding:11px 12px calc(11px + env(safe-area-inset-bottom));}
  .bb-in{max-width:620px;margin:0 auto;display:flex;gap:9px;}
  .btn{border:none;border-radius:12px;font-family:'Cairo';font-weight:800;font-size:14px;cursor:pointer;padding:14px;transition:.15s;}
  .btn:active{transform:scale(.98);}
  .btn-finish{flex:2;background:linear-gradient(145deg,var(--green),var(--green-dim));color:#eafff3;}
  .btn-ghost{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);}

  .modal{position:fixed;inset:0;z-index:100;background:rgba(4,7,11,.74);backdrop-filter:blur(6px);display:none;align-items:flex-end;}
  .modal.show{display:flex;}
  .sheet{width:100%;max-width:620px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:20px 20px 0 0;max-height:86vh;overflow-y:auto;padding:6px 15px 28px;animation:up .28s ease;}
  @keyframes up{from{transform:translateY(100%);}to{transform:translateY(0);}}
  .grab{width:36px;height:4px;background:var(--line);border-radius:3px;margin:8px auto 14px;}
  .sheet h2{font-size:16px;font-weight:800;margin:0 0 3px;}
  .sheet .muted{font-size:11.5px;color:var(--ink-faint);margin-bottom:14px;line-height:1.6;}
  .sheet .muted b{color:var(--ink-dim);}
  textarea{width:100%;min-height:150px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:11px;color:var(--ink);font-family:'Rubik';font-size:12.5px;padding:12px;
    outline:none;resize:vertical;line-height:1.7;direction:ltr;text-align:left;}
  textarea:focus{border-color:var(--amber);}
  .sheet-btns{display:flex;gap:8px;margin-top:12px;}
  .sheet-btn{flex:1;border-radius:11px;font-family:'Cairo';font-weight:700;font-size:13px;
    padding:12px;cursor:pointer;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);}
  .sheet-btn.pri{background:linear-gradient(145deg,var(--amber),var(--amber-deep));color:#1a1206;border:none;}
  .sheet-btn:active{transform:scale(.98);}

  .fin-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:4px 0 14px;}
  .fin-cell{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:11px;padding:12px 8px;text-align:center;}
  .fin-cell .fl{font-size:10px;color:var(--ink-faint);font-weight:600;margin-bottom:4px;}
  .fin-cell .fv{font-size:19px;font-weight:800;font-family:'Rubik';}
  .fin-cell.kcal .fv{color:var(--amber);}
  .fin-cell .fu{font-size:9px;color:var(--ink-faint);}

  .hist-item{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:12px;padding:11px 13px;margin-bottom:8px;}
  .hi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;}
  .hi-day{font-weight:800;font-size:13.5px;}
  .hi-day .pill{font-size:9.5px;font-family:'Rubik';font-weight:700;color:var(--amber);
    background:rgba(245,165,36,.12);padding:2px 7px;border-radius:20px;margin-right:5px;}
  .hi-meta{font-size:10px;color:var(--ink-faint);font-family:'Rubik';text-align:left;line-height:1.5;}
  .hi-ex{font-size:11.5px;color:var(--ink-dim);line-height:1.85;}
  .hi-ex b{color:var(--ink);font-family:'Rubik';}
  .empty{text-align:center;color:var(--ink-faint);font-size:12.5px;padding:36px 0;line-height:1.7;}

  .rest-ov{position:fixed;inset:0;z-index:150;background:rgba(6,10,16,.93);backdrop-filter:blur(8px);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;}
  .rest-ov.show{display:flex;}
  .rest-lbl{font-size:14px;color:var(--ink-dim);font-weight:700;}
  .rest-num{font-family:'Rubik';font-size:74px;font-weight:700;color:var(--amber);line-height:1;font-variant-numeric:tabular-nums;}
  .rest-btns{display:flex;gap:10px;}
  .rest-b{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:12px;
    padding:12px 20px;font-family:'Cairo';font-weight:700;font-size:14px;cursor:pointer;}
  .rest-b.skip{background:var(--amber);color:#1a1206;border:none;}

  .toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--green-dim);color:#eafff3;border:1px solid var(--green);padding:10px 20px;
    border-radius:30px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:200;pointer-events:none;max-width:90%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">
      <div class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#1a1206" stroke-width="2.4" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M6.5 12h11M3.5 9v6M20.5 9v6"/></svg></div>
      <div><h1>حديدي</h1><div class="sub">تنشيف · محمد · 42 سنة</div></div>
    </div>
    <div class="tools">
      <div class="icon-btn" id="ioBtn" title="استيراد/استخراج"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l4-4m-4 4l-4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg></div>
      <div class="icon-btn" id="histBtn" title="السجل"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg></div>
    </div>
  </div>
  <div class="days" id="dayTabs">
    <button class="day-tab active" data-day="push"><span>دفع</span><span class="en">PUSH</span></button>
    <button class="day-tab" data-day="pull"><span>سحب</span><span class="en">PULL</span></button>
    <button class="day-tab" data-day="legs"><span>أرجل</span><span class="en">LEGS</span></button>
  </div>
</header>

<div class="wrap">
  <div class="statbar">
    <div class="sc"><div class="l">مجموعات</div><div class="v num" id="stSets">0/0</div></div>
    <div class="divv"></div>
    <div class="sc"><div class="l">الحجم</div><div class="v num" id="stVol">0<span class="u"> كغ</span></div></div>
    <div class="divv"></div>
    <div class="sc timer"><div class="l">المدة</div><div class="v num" id="stTime">00:00</div></div>
  </div>
  <div id="exList"></div>
</div>

<div class="bottombar">
  <div class="bb-in">
    <button class="btn btn-finish" id="finishBtn">إنهاء التمرين ✓</button>
    <button class="btn btn-ghost" id="clearBtn">تفريغ</button>
  </div>
</div>

<div class="modal" id="ioModal"><div class="sheet"><div class="grab"></div>
  <h2>استيراد / استخراج</h2>
  <div class="muted">صيغة كل سطر:<br><b>اسم عربي | English | مجموعات | مدى | وزن</b></div>
  <textarea id="ioText" placeholder="ضغط صدر | Chest Press | 3 | 8-12 | 40"></textarea>
  <div class="sheet-btns">
    <button class="sheet-btn pri" id="importBtn">استيراد لليوم الحالي</button>
    <button class="sheet-btn" id="exportProgBtn">استخراج الحالي</button>
  </div>
</div></div>

<div class="modal" id="coachModal"><div class="sheet"><div class="grab"></div>
  <h2>خلصت التمرين 🏆</h2>
  <div class="fin-stats" id="finStats"></div>
  <div class="muted">انسخ الملخص والصقه بالمحادثة مع Claude.</div>
  <textarea id="coachText" readonly></textarea>
  <div class="sheet-btns"><button class="sheet-btn pri" id="copyCoachBtn">نسخ الملخص للكوتش</button></div>
</div></div>

<div class="modal" id="histModal"><div class="sheet"><div class="grab"></div>
  <h2>سجل التمارين</h2><div class="muted">آخر الجلسات المحفوظة.</div>
  <div id="histList"></div>
</div></div>

<div class="rest-ov" id="restOv">
  <div class="rest-lbl">راحة بين المجموعات</div>
  <div class="rest-num" id="restNum">75</div>
  <div class="rest-btns"><button class="rest-b" id="restAdd">+30 ث</button><button class="rest-b skip" id="restSkip">تخطّي</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== v3: برنامج منقّح للتنشيف — بلا تكرار + تغطية كاملة ===== */
const DEFAULT_PROGRAM={
  push:{name:'دفع',en:'PUSH',ex:[
    {ar:'ضغط صدر',en:'Chest Press',grp:'صدر',sets:3,rep:'10-12',w:40,note:'ثبّت الوزن — الهدف <b>12-12-12</b>.'},
    {ar:'ضغط صدر مائل',en:'Incline Chest Press',grp:'صدر',sets:3,rep:'10-12',w:40,note:'جهازك القديم. الهدف <b>10-10-10</b>.'},
    {ar:'فراشة صدر',en:'Pec Fly',grp:'صدر',sets:3,rep:'10-12',w:40,note:'عزل الصدر — الهدف <b>12-12-12</b>.'},
    {ar:'ضغط كتف',en:'Shoulder Press',grp:'كتف',sets:3,rep:'10-12',w:25,warn:true,note:'⚠️ سخّن الكتف قبل. أي ألم فوق مستوى الكتف = وقّف فورًا.'},
    {ar:'رفرفة جانبية كيبل',en:'Cable Lateral Raise',grp:'كتف',sets:3,rep:'12-15',w:5,note:'الدلت الجانبي — عرض الكتف.'},
    {ar:'ترايسبس جهاز',en:'Triceps Extension',grp:'ترايسبس',sets:3,rep:'10-12',w:41,note:''},
    {ar:'ترايسبس علوي كيبل',en:'Overhead Triceps',grp:'ترايسبس',sets:3,rep:'10-12',w:12.5,note:'الرأس الطويل — زاوية مختلفة عن الجهاز، مش تكرار.'},
    {ar:'بلانك',en:'Plank',grp:'بطن',sets:3,rep:'30-60ث',w:0,core:true,note:'<b>إضافة:</b> البطن كان ناقص تمامًا. سجّل الثواني بخانة التكرار.'},
  ]},
  pull:{name:'سحب',en:'PULL',ex:[
    {ar:'سحب علوي لاتس',en:'Lat Pulldown',grp:'ظهر',sets:3,rep:'10-12',w:45,note:'سحب عمودي — عرض الظهر.'},
    {ar:'سحب جالس ضيق',en:'Close Seated Row',grp:'ظهر',sets:3,rep:'10-12',w:50,note:'سحب أفقي — سمك الظهر. <b>شلنا «لو رو»</b> لأنه نفس النمط.'},
    {ar:'سحب ذراع مستقيم',en:'Straight-Arm Pulldown',grp:'ظهر',sets:3,rep:'12-15',w:0,note:'<b>إضافة:</b> يعزل اللاتس بدون الباي. ابدأ خفيف وركّز على الإحساس.'},
    {ar:'فيس بول',en:'Face Pull',grp:'كتف خلفي',sets:3,rep:'15-20',w:10,note:'⭐ <b>إضافة مهمة لكتفك:</b> تقوّي الدوّارة الخارجية ومنتصف الترابيس — وقاية وعلاج لانحشار الكتف. <b>وزن خفيف جدًا</b>، الحبل بمستوى الوجه، اسحب لحتى تصير إيديك جنب أذنيك مع دوران خارجي، واعصر لوحي الكتف. صفر ألم.'},
    {ar:'فراشة خلفي',en:'Rear Delt Fly',grp:'كتف خلفي',sets:2,rep:'10-12',w:26,note:'<b>26 كغ مش 33</b> — الأخف أعطى 12-10-8، الأثقل 10-8-8. نزّلناها لمجموعتين لأن الفيس بول بيغطي نفس المنطقة.'},
    {ar:'لور باك',en:'Lower Back',grp:'أسفل الظهر',sets:2,rep:'15',w:55,note:''},
    {ar:'باي همر كيبل',en:'Hammer Curl',grp:'باي',sets:3,rep:'10-12',w:16,note:'براكياليس + ساعد.'},
    {ar:'باي كيرل بار',en:'Biceps Curl',grp:'باي',sets:3,rep:'10-12',w:15,note:'الهدف <b>14-14-12</b>.'},
    {ar:'رفع أرجل معلّق/مستلقي',en:'Leg Raise',grp:'بطن',sets:3,rep:'12-15',w:0,core:true,note:'<b>إضافة:</b> أسفل البطن.'},
  ]},
  legs:{name:'أرجل',en:'LEGS',ex:[
    {ar:'دفع الأرجل',en:'Leg Press',grp:'فخذ كامل',sets:3,rep:'12-15',w:70,note:'الأثقل أول وأنت نشيط.'},
    {ar:'هيب ثرست',en:'Hip Thrust',grp:'مؤخرة',sets:3,rep:'12-15',w:20,note:'<b>نقلناه للمقدمة</b> — كنت تتخطّاه لأنه آخر شي. 20 كغ مضبوط على جهازك.'},
    {ar:'ثني الفخذ الخلفي',en:'Leg Curl',grp:'خلفي',sets:3,rep:'12-15',w:40,note:'⭐ <b>أولوية</b> — الخلفي أضعف من الأمامي. نزول بطيء 3 ثواني.'},
    {ar:'تمديد الفخذ',en:'Leg Extension',grp:'أمامي',sets:3,rep:'12-15',w:40,note:''},
    {ar:'هيب أبدكشن',en:'Hip Abduction',grp:'ورك',sets:2,rep:'15-20',w:40,note:''},
    {ar:'هيب أدكشن',en:'Hip Adduction',grp:'ورك',sets:2,rep:'15-20',w:30,note:'<b>30 مش 35</b> — كانت 11-9، نزّلها ووصّلها 15+.'},
    {ar:'رفع السمانة',en:'Calf Raise',grp:'سمانة',sets:3,rep:'15-20',w:70,opt:true,note:'⚠️ <b>حسب الكاحل</b> — في ألم؟ تجاهلها. بلا ألم؟ بطيء ومتحكّم بلا نطّ.'},
    {ar:'كرنش بالكيبل',en:'Cable Crunch',grp:'بطن',sets:3,rep:'12-15',w:0,core:true,note:'<b>إضافة:</b> أعلى البطن بمقاومة.'},
  ]},
};

const LS_LOG='hadidi_log_v3',LS_STATE='hadidi_state_v3',LS_PROG='hadidi_prog_v3',LS_TMR='hadidi_tmr_v3';
const BODY_KG=106, AGE=42;
let PROGRAM=loadProg(),currentDay='push',state=loadState(),startTime=loadTimer(),timerInt=null;

function loadProg(){try{const p=JSON.parse(localStorage.getItem(LS_PROG));return p||JSON.parse(JSON.stringify(DEFAULT_PROGRAM));}catch(e){return JSON.parse(JSON.stringify(DEFAULT_PROGRAM));}}
function saveProg(){localStorage.setItem(LS_PROG,JSON.stringify(PROGRAM));}
function loadState(){try{return JSON.parse(localStorage.getItem(LS_STATE))||{};}catch(e){return {};}}
function saveState(){localStorage.setItem(LS_STATE,JSON.stringify(state));}
function loadLog(){try{return JSON.parse(localStorage.getItem(LS_LOG))||[];}catch(e){return [];}}
function saveLog(l){localStorage.setItem(LS_LOG,JSON.stringify(l));}
function loadTimer(){const t=localStorage.getItem(LS_TMR);return t?JSON.parse(t):null;}
function saveTimer(){localStorage.setItem(LS_TMR,JSON.stringify(startTime));}

/* ===== إصلاح: مطابقة مرنة للاسم عند جلب آخر أداء ===== */
function normName(s){return (s||'').toString().trim().toLowerCase().replace(/[\s_\-]+/g,'');}

/* يبحث في كل السجل (مش آخر جلسة فقط) عن آخر مرة عُملت فيها هالحركة */
function lastPerf(day,ex){
  const log=loadLog();
  const keyEn=normName(ex.en), keyAr=normName(ex.ar);
  for(let i=log.length-1;i>=0;i--){
    const s=log[i];
    if(s.day!==day) continue;
    if(!s.ex) continue;
    const found=s.ex.find(e=>{
      const en=normName(e.en), ar=normName(e.ar);
      return (keyEn&&en===keyEn)||(keyAr&&ar===keyAr);
    });
    if(found&&found.sets&&found.sets.length){
      const reps=found.sets.map(x=>x.r).filter(Boolean);
      const ws=found.sets.map(x=>x.w).filter(Boolean);
      if(reps.length) return {reps,ws,date:s.date};
    }
  }
  return null;
}

function ensureDay(day){
  if(!state[day])state[day]={};
  PROGRAM[day].ex.forEach((ex,i)=>{if(!state[day][i])state[day][i]={sets:Array.from({length:ex.sets},()=>({w:'',r:'',done:false})),open:i===0};});
  Object.keys(state[day]).forEach(k=>{if(+k>=PROGRAM[day].ex.length)delete state[day][k];});
}

function startTimerIfNeeded(){if(!startTime||!startTime[currentDay]){if(!startTime)startTime={};startTime[currentDay]=Date.now();saveTimer();}runTimer();}
function runTimer(){clearInterval(timerInt);timerInt=setInterval(()=>{
  const s=startTime&&startTime[currentDay];
  if(!s){document.getElementById('stTime').textContent='00:00';return;}
  const sec=Math.floor((Date.now()-s)/1000);
  document.getElementById('stTime').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;
},1000);}
function elapsedMin(){const s=startTime&&startTime[currentDay];return s?Math.max(1,Math.round((Date.now()-s)/60000)):0;}
function estCalories(min,done,total){const it=total?done/total:0;const met=3.8+it*1.4;return Math.round(met*3.5*BODY_KG/200*min);}

function render(){
  ensureDay(currentDay);
  const D=PROGRAM[currentDay],list=document.getElementById('exList');
  list.innerHTML='';
  let lastGrp='';
  D.ex.forEach((ex,i)=>{
    if(ex.grp&&ex.grp!==lastGrp){
      const g=document.createElement('div');g.className='grp';g.textContent=ex.grp;
      list.appendChild(g);lastGrp=ex.grp;
    }
    const st=state[currentDay][i];
    const perf=lastPerf(currentDay,ex);
    const card=document.createElement('div');
    const allDone=st.sets.length&&st.sets.every(s=>s.done);
    card.className='ex'+(st.open?' open':'')+(allDone?' done':'');

    const badges=[`<span class="badge reps">${ex.sets}×${ex.rep}</span>`];
    if(ex.warn)badges.push(`<span class="badge warn">⚠</span>`);
    if(ex.opt)badges.push(`<span class="badge opt">اختياري</span>`);

    let lastHTML;
    if(perf){
      const uw=[...new Set(perf.ws)];
      const wtxt=uw.length?`<span class="num">${uw.join('/')}</span>كغ · `:'';
      lastHTML=`<div class="lastline">آخر مرة: ${wtxt}<span class="num">${perf.reps.join('-')}</span></div>`;
    }else{
      lastHTML=`<div class="lastline none">آخر مرة: — (لسه ما سجّلت)</div>`;
    }

    const head=document.createElement('div');head.className='ex-head';
    head.innerHTML=`<div class="ex-idx">${i+1}</div>
      <div class="ex-mid"><div class="ar">${ex.ar}</div><div class="en">${ex.en}</div>${lastHTML}</div>
      <div class="ex-tags">${badges.join('')}</div>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`;
    head.onclick=()=>{st.open=!st.open;saveState();render();};
    card.appendChild(head);

    const sets=document.createElement('div');sets.className='sets';
    const inner=document.createElement('div');inner.className='sets-in';
    const hd=document.createElement('div');hd.className='set-row hd';
    hd.innerHTML=`<span>#</span><span>وزن</span><span>${ex.core?'تكرار/ث':'تكرار'}</span><span>✓</span>`;inner.appendChild(hd);

    st.sets.forEach((s,si)=>{
      const ph=(perf&&perf.ws&&perf.ws[si])?perf.ws[si]:(ex.w||'—');
      const phr=(perf&&perf.reps&&perf.reps[si])?perf.reps[si]:'0';
      const row=document.createElement('div');row.className='set-row';
      row.innerHTML=`<div class="set-no">${si+1}</div>
        <div class="fld"><input type="number" inputmode="decimal" placeholder="${ph}" value="${s.w}" data-e="${i}" data-s="${si}" data-k="w"></div>
        <div class="fld"><input type="number" inputmode="numeric" placeholder="${phr}" value="${s.r}" data-e="${i}" data-s="${si}" data-k="r"></div>
        <div class="chk${s.done?' on':''}" data-e="${i}" data-s="${si}"><svg viewBox="0 0 24 24" fill="none" stroke="#eafff3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>`;
      inner.appendChild(row);
    });

    const tools=document.createElement('div');tools.className='row-tools';
    tools.innerHTML=`<button class="mini rest" data-rest="1">⏱️ راحة</button><button class="mini" data-add="${i}">+ مجموعة</button>${st.sets.length>1?`<button class="mini rm" data-rm="${i}">− حذف</button>`:''}`;
    inner.appendChild(tools);
    if(ex.note){const n=document.createElement('div');n.className='note';n.innerHTML=ex.note;inner.appendChild(n);}
    sets.appendChild(inner);card.appendChild(sets);list.appendChild(card);
  });
  bind();updateStats();
}

function bind(){
  document.querySelectorAll('.fld input').forEach(inp=>{inp.oninput=()=>{state[currentDay][+inp.dataset.e].sets[+inp.dataset.s][inp.dataset.k]=inp.value;saveState();updateStats();startTimerIfNeeded();};});
  document.querySelectorAll('.chk').forEach(c=>{c.onclick=()=>{
    const e=+c.dataset.e,si=+c.dataset.s,s=state[currentDay][e].sets[si];
    s.done=!s.done;
    if(s.done){
      const ex=PROGRAM[currentDay][e]||PROGRAM[currentDay].ex[e];
      const perf=lastPerf(currentDay,PROGRAM[currentDay].ex[e]);
      if(!s.w){ s.w = (perf&&perf.ws&&perf.ws[si]) ? perf.ws[si] : (PROGRAM[currentDay].ex[e].w||''); }
    }
    saveState();startTimerIfNeeded();if(s.done)openRest();render();};});
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{state[currentDay][+b.dataset.add].sets.push({w:'',r:'',done:false});saveState();render();});
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const e=+b.dataset.rm;if(state[currentDay][e].sets.length>1){state[currentDay][e].sets.pop();saveState();render();}});
  document.querySelectorAll('[data-rest]').forEach(b=>b.onclick=(ev)=>{ev.stopPropagation();openRest();});
}

function updateStats(){
  let done=0,total=0,vol=0;
  PROGRAM[currentDay].ex.forEach((ex,i)=>state[currentDay][i].sets.forEach(s=>{total++;if(s.done){done++;vol+=(parseFloat(s.w)||0)*(parseInt(s.r)||0);}}));
  document.getElementById('stSets').textContent=`${done}/${total}`;
  document.getElementById('stVol').innerHTML=`${vol.toLocaleString('en')}<span class="u"> كغ</span>`;
}

let restInt=null,restLeft=75;
function openRest(){restLeft=75;document.getElementById('restNum').textContent=restLeft;document.getElementById('restOv').classList.add('show');
  clearInterval(restInt);restInt=setInterval(()=>{restLeft--;document.getElementById('restNum').textContent=restLeft;
    if(restLeft<=0){clearInterval(restInt);closeRest();try{navigator.vibrate&&navigator.vibrate(300);}catch(e){}}},1000);}
function closeRest(){clearInterval(restInt);document.getElementById('restOv').classList.remove('show');}
document.getElementById('restSkip').onclick=closeRest;
document.getElementById('restAdd').onclick=()=>{restLeft+=30;document.getElementById('restNum').textContent=restLeft;};

document.querySelectorAll('.day-tab').forEach(t=>{t.onclick=()=>{
  document.querySelectorAll('.day-tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');
  currentDay=t.dataset.day;render();runTimer();window.scrollTo({top:0,behavior:'smooth'});};});

document.getElementById('finishBtn').onclick=()=>{
  const D=PROGRAM[currentDay];let done=0,total=0,vol=0;
  D.ex.forEach((ex,i)=>state[currentDay][i].sets.forEach(s=>{total++;if(s.done){done++;vol+=(parseFloat(s.w)||0)*(parseInt(s.r)||0);}}));
  if(!done){toast('علّم مجموعة وحدة على الأقل 💪');return;}
  const min=elapsedMin(),kcal=estCalories(min,done,total),log=loadLog();
  log.push({day:currentDay,dayName:D.name,en:D.en,date:new Date().toISOString(),min,kcal,vol,done,total,
    ex:D.ex.map((ex,i)=>({ar:ex.ar,en:ex.en,sets:state[currentDay][i].sets.filter(s=>s.done||s.r).map(s=>({w:s.w,r:s.r}))})).filter(e=>e.sets.length)});
  saveLog(log);delete state[currentDay];saveState();
  if(startTime)delete startTime[currentDay];saveTimer();
  render();runTimer();
  document.getElementById('finStats').innerHTML=`
    <div class="fin-cell"><div class="fl">المدة</div><div class="fv">${min}</div><div class="fu">دقيقة</div></div>
    <div class="fin-cell"><div class="fl">الحجم</div><div class="fv">${(vol/1000).toFixed(1)}<span class="fu">ط</span></div><div class="fu">${vol} كغ</div></div>
    <div class="fin-cell kcal"><div class="fl">السعرات</div><div class="fv">~${kcal}</div><div class="fu">تقديري</div></div>`;
  buildCoachText();
  document.getElementById('coachModal').classList.add('show');
};

function buildCoachText(){
  const log=loadLog(),s=log[log.length-1];if(!s)return;
  const d=new Date(s.date);
  let txt=`📋 ملخص تمرين — ${s.dayName} (${s.en})\n`;
  txt+=`التاريخ: ${d.toLocaleDateString('ar')}\n`;
  txt+=`المدة: ${s.min} دقيقة | الحجم: ${s.vol} كغ | مجموعات: ${s.done}/${s.total}\n`;
  txt+=`السعرات المحروقة (تقديري): ~${s.kcal} سعرة\n`;
  txt+=`وزن الجسم بالحساب: ${BODY_KG} كغ | العمر: ${AGE}\n\n— التمارين —\n`;
  s.ex.forEach((e,i)=>{
    const reps=e.sets.map(x=>x.r).filter(Boolean).join('-');
    const ws=e.sets.map(x=>x.w).filter(Boolean);
    const w=ws.length?[...new Set(ws)].join('/')+'كغ':'';
    txt+=`${i+1}. ${e.ar} (${e.en}): ${w} → ${reps}\n`;
  });
  txt+=`\nحلّل التمرين وقلّي: وين تقدّمت، شو أزيد المرة الجاية، وأي ملاحظة على الكتف.`;
  document.getElementById('coachText').value=txt;
}
document.getElementById('copyCoachBtn').onclick=()=>{const t=document.getElementById('coachText');t.select();copyText(t.value);toast('اننسخ الملخص ✓');};

document.getElementById('clearBtn').onclick=()=>{if(confirm('تفريغ تمرين اليوم الحالي بدون حفظ؟')){delete state[currentDay];saveState();if(startTime)delete startTime[currentDay];saveTimer();render();runTimer();}};

document.getElementById('ioBtn').onclick=()=>{document.getElementById('ioText').value='';document.getElementById('ioModal').classList.add('show');};
document.getElementById('exportProgBtn').onclick=()=>{
  const D=PROGRAM[currentDay];
  const txt=D.ex.map(e=>`${e.ar} | ${e.en} | ${e.sets} | ${e.rep} | ${e.w||0}`).join('\n');
  document.getElementById('ioText').value=txt;copyText(txt);toast('اننسخ برنامج اليوم ✓');
};
document.getElementById('importBtn').onclick=()=>{
  const raw=document.getElementById('ioText').value.trim();
  if(!raw){toast('الصق التمارين أول 📋');return;}
  const ex=[];
  raw.split('\n').map(l=>l.trim()).filter(Boolean).forEach(ln=>{
    const p=ln.split('|').map(x=>x.trim());if(p.length<2)return;
    ex.push({ar:p[0]||p[1],en:p[1]||p[0],sets:parseInt(p[2])||3,rep:p[3]||'10-12',w:parseFloat(p[4])||0,note:''});
  });
  if(!ex.length){toast('ما قدرت أقرأ التمارين');return;}
  PROGRAM[currentDay].ex=ex;saveProg();delete state[currentDay];saveState();
  document.getElementById('ioModal').classList.remove('show');render();toast(`تم استيراد ${ex.length} تمرين ✓`);
};

document.getElementById('histBtn').onclick=()=>{renderHist();document.getElementById('histModal').classList.add('show');};
function renderHist(){
  const log=loadLog().slice().reverse(),el=document.getElementById('histList');
  if(!log.length){el.innerHTML='<div class="empty">لسه ما في جلسات محفوظة.<br>خلّص تمرينك واضغط «إنهاء التمرين».</div>';return;}
  el.innerHTML=log.map(s=>{
    const d=new Date(s.date);
    const meta=`${d.toLocaleDateString('ar',{day:'numeric',month:'short'})}<br>${s.min||'—'} د · ~${s.kcal||'—'} سعرة`;
    const lines=s.ex.map(e=>{const reps=e.sets.map(x=>x.r).filter(Boolean).join('-');const ws=[...new Set(e.sets.map(x=>x.w).filter(Boolean))];return `<div class="hi-ex">${e.ar} — <b>${ws.length?ws.join('/')+'كغ ':''}${reps}</b></div>`;}).join('');
    return `<div class="hist-item"><div class="hi-top"><div class="hi-day">${s.dayName}<span class="pill">${s.en}</span></div><div class="hi-meta">${meta}</div></div>${lines}</div>`;
  }).join('');
}

['ioModal','coachModal','histModal'].forEach(id=>{document.getElementById(id).onclick=(e)=>{if(e.target.id===id)e.currentTarget.classList.remove('show');};});

function copyText(t){try{navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e2){}document.body.removeChild(ta);}}
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show';clearTimeout(toastT);toastT=setTimeout(()=>t.className='toast',2400);}

render();runTimer();
</script>
</body>
